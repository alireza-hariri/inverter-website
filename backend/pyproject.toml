[project]
name = "observability_run_project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.0", "djangorestframework>=3.15", "djangorestframework-simplejwt>=5.3", "django-filter>=24.0", "django-cors-headers>=4.4", "Pillow>=10.0", "requests[socks]>=2.32", "pydantic-settings>=2.4"]

# `pip install -e .` installs the dependencies, not this project: Django runs
# from the project directory, so `apps` and `config` are already importable.
# Without an explicit empty list, setuptools tries to autodiscover packages,
# finds `apps`/`config`/`static`/`templates`/`media` side by side, and refuses.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
